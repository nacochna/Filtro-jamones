<!doctype html>
<html lang="es">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#173f3f">
	<title>Despensa | Inventario</title>
	<style>
		:root {
			--ink: #173437;
			--muted: #6a7978;
			--paper: #f4f0e8;
			--surface: #fffdf8;
			--line: #d9dfd7;
			--teal: #176b65;
			--teal-dark: #124d4b;
			--coral: #dd6b4f;
			--coral-dark: #a84938;
			--yellow: #f4c95d;
			--shadow: 0 18px 45px rgba(24, 55, 56, .10);
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			color: var(--ink);
			background: var(--paper);
			font-family: "Trebuchet MS", "Segoe UI", sans-serif;
			line-height: 1.45;
		}
		button, input, select { font: inherit; }
		button { cursor: pointer; }
		.app-shell { min-height: 100vh; background: radial-gradient(circle at 85% -10%, #f8d77c 0, transparent 27%), var(--paper); }
		.topbar { padding: 28px 5vw 22px; background: var(--teal-dark); color: #fffdf8; }
		.topbar-inner, main { width: min(1180px, 100%); margin: auto; }
		.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
		.eyebrow { margin: 0 0 5px; color: var(--yellow); font-size: .72rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
		h1, h2, p { margin-top: 0; }
		h1 { margin-bottom: 0; font-family: Georgia, serif; font-size: clamp(2rem, 6vw, 3.7rem); line-height: .98; letter-spacing: -.04em; }
		.count-badge { display: flex; align-items: center; gap: 8px; padding: 9px 13px; border: 1px solid rgba(255,255,255,.25); border-radius: 99px; color: #e7f4e9; font-size: .85rem; white-space: nowrap; }
		main { padding: 24px 5vw 130px; }
		.toolbar { display: grid; gap: 12px; margin-bottom: 20px; }
		.search-wrap { position: relative; }
		.search-wrap span { position: absolute; top: 50%; left: 15px; color: var(--teal); transform: translateY(-50%); font-size: 1.15rem; }
		.search-wrap input { padding-left: 44px; }
		input, select { width: 100%; padding: 13px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); outline: 0; }
		input:focus, select:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(23,107,101,.13); }
		.toolbar-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
		.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 10px 16px; border: 0; border-radius: 10px; font-weight: 800; transition: transform .15s ease, background .15s ease, opacity .15s ease; }
		.btn:hover { transform: translateY(-1px); }
		.btn-primary { background: var(--yellow); color: #463916; }
		.btn-soft { background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
		.btn-danger { background: var(--coral); color: white; }
		.btn-danger:disabled { cursor: not-allowed; opacity: .4; transform: none; }
		.filter-panel { display: none; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px; border: 1px solid var(--line); border-radius: 12px; background: rgba(255,253,248,.75); }
		.filter-panel.is-open { display: grid; }
		.filter-panel label, .form-field label { display: block; margin-bottom: 6px; color: var(--muted); font-size: .75rem; font-weight: 800; text-transform: uppercase; letter-spacing: .07em; }
		.table-card { overflow: hidden; border: 1px solid var(--line); border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
		.table-scroll { overflow-x: auto; }
		table { width: 100%; min-width: 650px; border-collapse: collapse; }
		th { padding: 14px 16px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: .72rem; text-align: left; text-transform: uppercase; letter-spacing: .09em; white-space: nowrap; }
		th button { padding: 0; border: 0; background: none; color: inherit; font: inherit; text-transform: inherit; letter-spacing: inherit; }
		th button:hover { color: var(--teal); }
		td { padding: 14px 16px; border-bottom: 1px solid #e8ece6; vertical-align: middle; }
		tbody tr { outline: 2px solid transparent; transition: background .15s ease; }
		tbody tr:hover { background: #f4f8f2; }
		tbody tr.selected { background: #e5f3ed; outline-color: var(--teal); outline-offset: -2px; }
		tbody tr:last-child td { border-bottom: 0; }
		.quantity { font-family: Georgia, serif; font-size: 1.35rem; font-weight: 700; }
		.product-name { font-weight: 800; }
		.product-type { display: block; margin-top: 2px; color: var(--muted); font-size: .78rem; }
		.photo { width: 54px; height: 54px; overflow: hidden; border-radius: 9px; background: #e9e8da; }
		.photo img { width: 100%; height: 100%; object-fit: cover; }
		.photo-fallback { display: grid; place-items: center; width: 100%; height: 100%; color: var(--teal); font-size: 1.25rem; }
		.empty { padding: 52px 20px; color: var(--muted); text-align: center; }
		.empty strong { display: block; margin-bottom: 4px; color: var(--ink); font-family: Georgia, serif; font-size: 1.4rem; }
		.stock-panel { position: fixed; right: 14px; bottom: 14px; left: 14px; z-index: 5; display: none; align-items: center; justify-content: space-between; gap: 15px; padding: 13px 15px; border: 1px solid rgba(255,255,255,.15); border-radius: 15px; background: var(--teal-dark); color: white; box-shadow: 0 14px 35px rgba(18,77,75,.3); }
		.stock-panel.is-visible { display: flex; }
		.stock-info { min-width: 0; }
		.stock-info strong, .stock-info span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
		.stock-info span { color: #c9e2da; font-size: .8rem; }
		.stock-controls { display: flex; flex-shrink: 0; align-items: center; gap: 8px; }
		.stock-button { display: grid; place-items: center; width: 42px; height: 42px; border: 0; border-radius: 9px; background: var(--yellow); color: var(--ink); font-size: 1.5rem; font-weight: 700; }
		.modal-backdrop { position: fixed; inset: 0; z-index: 10; display: none; place-items: center; padding: 18px; background: rgba(12,34,34,.62); }
		.modal-backdrop.is-open { display: grid; }
		.modal { width: min(560px, 100%); max-height: 92vh; overflow-y: auto; padding: 24px; border-radius: 17px; background: var(--surface); box-shadow: 0 30px 70px rgba(0,0,0,.3); }
		.modal-header { display: flex; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
		.modal h2 { margin-bottom: 3px; font-family: Georgia, serif; font-size: 1.8rem; }
		.modal-header p { margin: 0; color: var(--muted); font-size: .9rem; }
		.close-btn { align-self: flex-start; width: 34px; height: 34px; border: 0; border-radius: 50%; background: #edf0e9; color: var(--ink); font-size: 1.2rem; }
		.form-grid { display: grid; gap: 14px; }
		.form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
		.form-error { min-height: 20px; margin: 14px 0 0; color: var(--coral-dark); font-size: .85rem; }
		@media (min-width: 700px) {
			.topbar { padding-top: 42px; padding-bottom: 35px; }
			.toolbar { grid-template-columns: minmax(240px, 1fr) auto; align-items: center; }
			.toolbar-actions { grid-template-columns: auto auto auto; }
			.filter-panel { grid-column: 1 / -1; }
			.form-grid { grid-template-columns: 1fr 1fr; }
			.form-field.full { grid-column: 1 / -1; }
			.stock-panel { right: 5vw; left: auto; width: min(440px, calc(100% - 10vw)); }
		}
	</style>
</head>
<body>
	<div class="app-shell">
		<header class="topbar">
			<div class="topbar-inner brand-row">
				<div><p class="eyebrow">Control de despensa</p><h1>Inventario</h1></div>
				<div class="count-badge"><span aria-hidden="true">●</span><span id="itemCount">0 productos</span></div>
			</div>
		</header>

		<main>
			<section class="toolbar" aria-label="Herramientas de inventario">
				<div class="search-wrap"><span aria-hidden="true">⌕</span><input id="searchInput" type="search" placeholder="Buscar por nombre..." autocomplete="off"></div>
				<div class="toolbar-actions">
					<button class="btn btn-soft" id="filterToggle" type="button" aria-expanded="false">☷ &nbsp; Filtros</button>
					<button class="btn btn-danger" id="deleteButton" type="button" disabled title="Selecciona un producto para eliminar">⌫ &nbsp; Eliminar</button>
					<button class="btn btn-primary" id="addButton" type="button">＋ &nbsp; Agregar producto</button>
				</div>
				<div class="filter-panel" id="filterPanel">
					<div><label for="typeFilter">Tipo</label><select id="typeFilter"><option value="">Todos los tipos</option></select></div>
					<div><label for="brandFilter">Marca</label><select id="brandFilter"><option value="">Todas las marcas</option></select></div>
				</div>
			</section>

			<section class="table-card" aria-label="Lista de productos">
				<div class="table-scroll">
					<table>
						<thead><tr><th><button id="sortQuantity" type="button">Cantidad <span aria-hidden="true">↕</span></button></th><th>Nombre</th><th>Marca</th><th><button id="sortDate" type="button">Fecha <span aria-hidden="true">↕</span></button></th><th>Foto</th></tr></thead>
						<tbody id="productBody"></tbody>
					</table>
				</div>
				<div class="empty" id="emptyState" hidden><strong>No hay productos que mostrar</strong><span>Prueba con otro filtro o agrega un nuevo producto.</span></div>
			</section>
		</main>
	</div>

	<aside class="stock-panel" id="stockPanel" aria-live="polite">
		<div class="stock-info"><strong id="selectedName">Producto</strong><span>Stock seleccionado: <b id="selectedQuantity">0</b> unidades</span></div>
		<div class="stock-controls"><button class="stock-button" id="decreaseButton" type="button" aria-label="Restar una unidad">−</button><button class="stock-button" id="increaseButton" type="button" aria-label="Sumar una unidad">＋</button></div>
	</aside>

	<div class="modal-backdrop" id="modalBackdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
		<form class="modal" id="productForm">
			<div class="modal-header"><div><h2 id="modalTitle">Nuevo producto</h2><p>Completa los datos para sumarlo al inventario.</p></div><button class="close-btn" id="closeModal" type="button" aria-label="Cerrar">×</button></div>
			<div class="form-grid">
				<div class="form-field"><label for="quantity">Cantidad</label><input id="quantity" name="quantity" type="number" min="0" step="1" required></div>
				<div class="form-field"><label for="date">Fecha</label><input id="date" name="date" type="date" required></div>
				<div class="form-field full"><label for="name">Nombre</label><input id="name" name="name" type="text" placeholder="Ej. Jamón ahumado" required></div>
				<div class="form-field"><label for="brand">Marca</label><input id="brand" name="brand" type="text" placeholder="Ej. La Preferida" required></div>
				<div class="form-field"><label for="type">Tipo</label><input id="type" name="type" type="text" placeholder="Ej. Jamón cocido" required></div>
				<div class="form-field full"><label for="image">Ruta de imagen local</label><input id="image" name="image" type="text" placeholder="fotos/producto.jpg"></div>
			</div>
			<p class="form-error" id="formError" role="alert"></p>
			<div class="form-actions"><button class="btn btn-soft" id="cancelModal" type="button">Cancelar</button><button class="btn btn-primary" type="submit">Guardar producto</button></div>
		</form>
	</div>

	<script>
		const STORAGE_KEY = 'despensa-inventario-v1';
		const demoProducts = [
			{ id: 'demo-1', quantity: 24, name: 'Jamón serrano', brand: 'Monteverde', type: 'Curado', date: '2026-10-12', image: 'fotos/jamon-serrano.jpg' },
			{ id: 'demo-2', quantity: 11, name: 'Jamón ahumado', brand: 'La Montaña', type: 'Ahumado', date: '2026-10-08', image: 'fotos/jamon-ahumado.jpg' },
			{ id: 'demo-3', quantity: 36, name: 'Jamón de pavo', brand: 'Del Prado', type: 'Pavo', date: '2026-09-27', image: 'fotos/jamon-pavo.jpg' },
			{ id: 'demo-4', quantity: 8, name: 'Lomo embuchado', brand: 'Casa Norte', type: 'Embutido', date: '2026-10-03', image: 'fotos/lomo.jpg' }
		];
		let products = loadProducts();
		let selectedId = null;
		let sortState = { key: null, direction: 1 };

		const $ = (id) => document.getElementById(id);
		function loadProducts() {
			try { const saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); return Array.isArray(saved) ? saved : demoProducts; }
			catch (error) { return demoProducts; }
		}
		function persist() { localStorage.setItem(STORAGE_KEY, JSON.stringify(products)); }
		function formatDate(value) { if (!value) return 'Sin fecha'; return new Intl.DateTimeFormat('es-CL', { day: '2-digit', month: 'short', year: 'numeric' }).format(new Date(value + 'T00:00:00')); }
		function escapeHTML(value) { return String(value).replace(/[&<>'"]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#039;', '"': '&quot;' }[char])); }

		function refreshFilterOptions() {
			const selectedType = $('typeFilter').value, selectedBrand = $('brandFilter').value;
			const fill = (id, field, label) => { const values = [...new Set(products.map((item) => item[field]).filter(Boolean))].sort(); $(id).innerHTML = `<option value="">${label}</option>` + values.map((value) => `<option value="${escapeHTML(value)}">${escapeHTML(value)}</option>`).join(''); $(id).value = values.includes(id === 'typeFilter' ? selectedType : selectedBrand) ? (id === 'typeFilter' ? selectedType : selectedBrand) : ''; };
			fill('typeFilter', 'type', 'Todos los tipos'); fill('brandFilter', 'brand', 'Todas las marcas');
		}
		function visibleProducts() {
			const query = $('searchInput').value.trim().toLowerCase(), type = $('typeFilter').value, brand = $('brandFilter').value;
			return products.filter((item) => (!query || item.name.toLowerCase().includes(query)) && (!type || item.type === type) && (!brand || item.brand === brand)).sort((a, b) => { if (!sortState.key) return 0; const valueA = sortState.key === 'quantity' ? Number(a.quantity) : new Date(a.date).getTime(); const valueB = sortState.key === 'quantity' ? Number(b.quantity) : new Date(b.date).getTime(); return (valueB - valueA) * sortState.direction; });
		}
		function render() {
			const list = visibleProducts();
			$('itemCount').textContent = `${products.length} ${products.length === 1 ? 'producto' : 'productos'}`;
			$('productBody').innerHTML = list.map((item) => `<tr data-id="${item.id}" class="${item.id === selectedId ? 'selected' : ''}" tabindex="0"><td class="quantity">${Number(item.quantity)}</td><td><span class="product-name">${escapeHTML(item.name)}</span><span class="product-type">${escapeHTML(item.type)}</span></td><td>${escapeHTML(item.brand)}</td><td>${formatDate(item.date)}</td><td><div class="photo"><img src="${escapeHTML(item.image || '')}" alt="" onerror="this.style.display='none'; this.nextElementSibling.hidden=false"><span class="photo-fallback" hidden aria-hidden="true">▧</span></div></td></tr>`).join('');
			$('emptyState').hidden = list.length > 0;
			$('deleteButton').disabled = !selectedId;
			updateStockPanel();
			document.querySelectorAll('#productBody tr').forEach((row) => { row.addEventListener('click', () => selectProduct(row.dataset.id)); row.addEventListener('keydown', (event) => { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); selectProduct(row.dataset.id); } }); });
		}
		function selectProduct(id) { selectedId = id; render(); }
		function updateStockPanel() { const selected = products.find((item) => item.id === selectedId); $('stockPanel').classList.toggle('is-visible', Boolean(selected)); if (selected) { $('selectedName').textContent = selected.name; $('selectedQuantity').textContent = selected.quantity; } }
		function changeQuantity(amount) { const selected = products.find((item) => item.id === selectedId); if (!selected) return; selected.quantity = Math.max(0, Number(selected.quantity) + amount); persist(); render(); }
		function setSort(key) { sortState = { key, direction: sortState.key === key ? sortState.direction * -1 : 1 }; render(); }
		function openModal() { $('modalBackdrop').classList.add('is-open'); $('productForm').reset(); $('quantity').value = 0; $('date').value = new Date().toISOString().slice(0, 10); $('formError').textContent = ''; $('name').focus(); }
		function closeModal() { $('modalBackdrop').classList.remove('is-open'); }

		$('searchInput').addEventListener('input', render);
		$('typeFilter').addEventListener('change', render); $('brandFilter').addEventListener('change', render);
		$('filterToggle').addEventListener('click', () => { const open = $('filterPanel').classList.toggle('is-open'); $('filterToggle').setAttribute('aria-expanded', open); });
		$('sortQuantity').addEventListener('click', () => setSort('quantity')); $('sortDate').addEventListener('click', () => setSort('date'));
		$('increaseButton').addEventListener('click', () => changeQuantity(1)); $('decreaseButton').addEventListener('click', () => changeQuantity(-1));
		$('addButton').addEventListener('click', openModal); $('closeModal').addEventListener('click', closeModal); $('cancelModal').addEventListener('click', closeModal);
		$('modalBackdrop').addEventListener('click', (event) => { if (event.target === $('modalBackdrop')) closeModal(); });
		document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && $('modalBackdrop').classList.contains('is-open')) closeModal(); });
		$('deleteButton').addEventListener('click', () => { const selected = products.find((item) => item.id === selectedId); if (!selected || !window.confirm(`¿Eliminar “${selected.name}” del inventario?`)) return; products = products.filter((item) => item.id !== selectedId); selectedId = null; persist(); refreshFilterOptions(); render(); });
		$('productForm').addEventListener('submit', (event) => { event.preventDefault(); const data = new FormData(event.target); const item = { id: `product-${Date.now()}`, quantity: Number(data.get('quantity')), name: data.get('name').trim(), brand: data.get('brand').trim(), type: data.get('type').trim(), date: data.get('date'), image: data.get('image').trim() }; if (!item.name || !item.brand || !item.type || !item.date || item.quantity < 0) { $('formError').textContent = 'Revisa los campos obligatorios antes de guardar.'; return; } products.unshift(item); selectedId = item.id; persist(); refreshFilterOptions(); render(); closeModal(); });
		refreshFilterOptions(); render();
	</script>
</body>
</html>
